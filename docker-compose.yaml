# this compose file setup contains a single kafka instance that relies on kraft for coordination. No zookeeper needed

# project name
name: kron
services:
    producer:
        build:
            context: .
            dockerfile: ./docker/Dockerfile
            target: producer
        container_name: kron-producer
        depends_on:
            kafka:
                condition: service_healthy
        volumes:
            - ./tabs:/app/tabs
        environment:
            # comma-separated kafka server addresses
            - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
        networks:
            - kron

    consumer-cluster-a:
        build:
            context: .
            dockerfile: ./docker/Dockerfile
            target: consumer
        deploy:
            replicas: 1
        depends_on:
            kafka:
                condition: service_healthy
        environment:
            # comma-separated kafka server addresses
            - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
            # cluster
            - CLUSTER=cluster-a
        networks:
            - kron

    consumer-cluster-b:
        build:
            context: .
            dockerfile: ./docker/Dockerfile
            target: consumer
        deploy:
            replicas: 1
        depends_on:
            kafka:
                condition: service_healthy
        environment:
            # comma-separated kafka server addresses
            - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
            # cluster
            - CLUSTER=cluster-b
        networks:
            - kron

    # retry queue consumer
    consumer-retry-cluster-a:
        build:
            context: .
            dockerfile: ./docker/Dockerfile
            target: consumer
        deploy:
            replicas: 1
        depends_on:
            kafka:
                condition: service_healthy
        environment:
            # comma-separated kafka server addresses
            - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
            # cluster
            - CLUSTER=cluster-a
            # flag indicating that consumer is a retry consumer
            - RETRY=true
        networks:
            - kron

    consumer-dlq-cluster-a:
        build:
            context: .
            dockerfile: ./docker/Dockerfile
            target: consumer
        container_name: kron-dlq-consumer
        depends_on:
            kafka:
                condition: service_healthy
        environment:
            # comma-separated kafka server addresses
            - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
            # cluster
            - CLUSTER=cluster-a
            # flag indicating that consumer is a dlq consumer
            - DLQ=true
        networks:
            - kron

    prometheus:
        container_name: kron-prometheus
        image: prom/prometheus
        # volumes:
        # - ./prometheus.yml:/etc/prometheus/prometheus.yml
        # - ./alert_rules.yml:/etc/prometheus/alert_rules.yml
        # - prometheus_data:/prometheus
        # command:
        # - '--config.file=/etc/prometheus/prometheus.yml'
        # links:
        # - alertmanager:alertmanager
        ports:
            - 9090:9090

    kafka:
        image: bitnami/kafka
        container_name: kron-kafka
        environment:
            # unique node id
            - KAFKA_CFG_NODE_ID=0
            # node functioning as controller (metadata store) and broker
            - KAFKA_CFG_PROCESS_ROLES=controller,broker
            # listener endpoints for client (9092), raft traffic (9093)
            - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
            # no encryption policy set. use plaintext
            - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            # vote definitions. node id = 0, kraft port = 9093
            - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
            # use "CONTROLLER" listener name for quorum activities
            - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
            - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
        ports:
            - 9092:9092
        healthcheck:
            test: kafka-topics.sh --list --bootstrap-server localhost:9092 || exit 1
            interval: 1s
            timeout: 60s
            retries: 60
        volumes:
            - ./.kafka-data:/bitnami/kafka
        networks:
            - kron

networks:
    kron:
        driver: bridge
